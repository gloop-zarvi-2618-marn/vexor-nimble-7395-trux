name: Remote Anime Archiver

on:
  repository_dispatch:
    types: [archive_request]

permissions:
  contents: write
  actions: read

jobs:
  archive-and-release:
    name: Archive ${{ github.event.client_payload.anime_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Execute Archiver Worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          cd worker
          go mod init archiver-worker
          go mod tidy
          go run archiver.go
